<!doctype html>
<meta charset="utf-8">
<title>odm — project status</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --ink:#e6edf3; --muted:#8b949e;
    --line:#2a313c; --accent:#58a6ff;
    --done:#3fb950; --closed:#2dd4bf; --planned:#d29922; --scoped:#a371f7; --tentative:#6e7681;
    --active:#58a6ff;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f8fa; --panel:#fff; --panel2:#f0f3f6; --ink:#1f2328; --muted:#636c76;
           --line:#d0d7de; --accent:#0969da; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .wrap{max-width:1040px;margin:0 auto;padding:28px 20px 60px}
  header h1{margin:0 0 4px;font-size:22px;letter-spacing:.2px}
  header h1 .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent)}
  header .sub{color:var(--muted);font-size:13.5px}
  .summary{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 8px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        padding:10px 14px;min-width:120px}
  .stat .n{font-size:22px;font-weight:600}
  .stat .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin:14px 0 22px;font-size:12.5px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .group-title{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);
               margin:26px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
  .card{background:var(--panel);border:1px solid var(--line);border-left-width:4px;
        border-radius:12px;padding:16px 18px;margin:12px 0}
  .card .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .card .id{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:15px}
  .card .name{font-weight:600;font-size:16px}
  .badge{margin-left:auto;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;
         text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
  .cap{color:var(--muted);font-size:13.5px;margin:8px 0 10px}
  .meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin-bottom:10px}
  .meta b{color:var(--ink);font-weight:600}
  .bar{height:7px;border-radius:6px;background:var(--panel2);overflow:hidden;margin:2px 0 10px}
  .bar > i{display:block;height:100%}
  .slices{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11.5px;padding:3px 8px;border-radius:6px;background:var(--panel2);
        border:1px solid var(--line);color:var(--muted);display:inline-flex;gap:6px;align-items:center}
  .chip.done{color:var(--ink)}
  .chip .s{font-family:ui-monospace,Menlo,monospace;opacity:.7}
  .note{font-size:12px;color:var(--muted);margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
  footer{margin-top:34px;color:var(--muted);font-size:12px;text-align:center}
</style>

<div class="wrap">
  <header>
    <h1><span class="mono">odm</span> — project status <span style="color:var(--muted);font-weight:400">· design-v1.0.0</span></h1>
    <div class="sub">ODD Document Manager — markdown/git-native planning substrate. Arcs shown in design (dependency) order.</div>
  </header>

  <div class="summary" id="summary"></div>

  <div class="legend">
    <span><i class="dot" style="background:var(--done)"></i>complete · merged, CI-green</span>
    <span><i class="dot" style="background:var(--active)"></i>active · in progress now</span>
    <span><i class="dot" style="background:var(--closed)"></i>closed · composed, CI-pending</span>
    <span><i class="dot" style="background:var(--planned)"></i>planned · arc-plan drafted</span>
    <span><i class="dot" style="background:var(--scoped)"></i>scoped · extension arc</span>
    <span><i class="dot" style="background:var(--tentative)"></i>tentative · roadmap-only</span>
  </div>

  <div id="board"></div>

  <footer id="foot"></footer>
</div>

<script>
const C = {complete:'var(--done)', active:'var(--active)', closed:'var(--closed)', planned:'var(--planned)',
           scoped:'var(--scoped)', tentative:'var(--tentative)'};
const LABEL = {complete:'Complete', active:'Active', closed:'Closed · CI-pending', planned:'Planned',
               scoped:'Scoped', tentative:'Tentative'};

// ── Data: edit here as the work moves. status ∈ complete|closed|planned|scoped|tentative
const DATA = {
  generated: "2026-06-30",
  groups: [
    { title: "v1.0.0 — MVP (A1–A3) + core (A4–A6)", arcs: [
      { id:"A1", name:"Substrate & node CRUD", status:"complete", deps:"—", crate:"odm-core, odm-store, odm-cli, oxur-odm",
        cap:"Workspace + crates; ULID identity; node types; frontmatter schema; nodes/YYYY/MM/<ULID>.md store; gix; odm.toml; CRUD + use/context; check v1.",
        done:6, total:6, note:"Merged to main, CI-green. (Predates the v2.0 formal arc-close — composed-in-fact; disclosed gap.)" },

      { id:"A2", name:"Graph, gates & derived order", status:"complete", deps:"A1", crate:"odm-graph, odm-core",
        cap:"Typed edges; petgraph DAG; cycles + tears; multi-gate status w/ evidence; evidence-leveled satisfaction; next/blocked/path/topo; staleness; recomposition integrity; check v2.",
        done:8, total:8, note:"Merged to main, CI-green. odm is self-host-usable: build + advance a graph via the CLI alone." },

      { id:"A3", name:"Rollup & orient", status:"complete", deps:"A2", crate:"odm-core, odm-cli", mvp:true,
        cap:"Generated ROLLUP.md (+--json); orient/brief (vision → focus → ready/blocked → integrity → drift); provenance view; errors-as-affordances; bare-odm orients.",
        slices:[["01","Arc02 cleanup","done"],["02","rollup generation","done"],["03","orient/brief + bare-odm","done"],["04","--json + polish","done"]],
        note:"★ MVP (A1–A3) COMPLETE. Arc-close passed, no silent drops. Merged." },

      { id:"A4", name:"Index & cache", status:"complete", deps:"A3", crate:"odm-index",
        cap:"Incremental, DB-/FTS-free stat-cache under .odm/; replaces full-scan in list/orient/graph-build/check/rollup; racy-git-correct; self-healing; 100k benchmark.",
        slices:[["01","record + persistence","done"],["02","cold-path build","done"],["03","warm-path racy-correct","done"],["04","enrich + maps + wire list","done"],
                ["05","graph adapter + derived readers","done"],["06","enrich origin/decomposed + wire check/rollup/orient","done"],["07","early-cutoff invalidation","done"],["08","100k benchmark","done"]],
        note:"✅ Arc-close done; independent gate PASS-WITH-NOTES; CI green 2026-06-30 → all rows reproduced (P-4 done). ODD-0014 [P]→[E]." },

      { id:"A5", name:"Reconciliation", status:"complete", deps:"A2, A3", crate:"odm-reconcile",
        cap:"desired_facts + Probe trait (shell/file); reconcile on demand; drift folded into rollup/orient; affects edge + stale-doc check; deferred surfacing + re-entry; incremental freshness on every command (ODD-0019).",
        slices:[["01","desired_facts + Probe trait + shell probe","done"],["02","file probe + probe-runner","done"],["03","odm reconcile (on demand)","done"],["04","drift in rollup/orient","done"],
                ["05","affects edge + stale-doc check","done"],["06","deferred surfacing + re-entry","done"],["07","probes-as-rules: inputs/volatile + drift snapshot","done"],["08","freshness-on-every-command + honest staleness","done"]],
        note:"✅ CLOSED (composed; CI-green on release/1.0.x 2026-07-06). All 8 slices CDC-verified; arc-close composition check passed + independent arc-gate review (PASS-WITH-NOTES) — arc05-reconciliation/closing-report.md. The marquee state-drift killer (ODD-0001 C2) lands, and ODD-0019 makes it incremental on every command: bare `odm` runs ZERO volatile probes, honest 'last checked Xm ago', drift-aware ROLLUP cutoff, `next` stays graph-pure. Zero index change across ALL 8 slices (the slice02 store-vs-index boundary held the whole arc). Ledger reconciled at close: slice08 appended as stable A-14 (not a renumber). Carried to A6: two-reads optimization + CLAUDE.md oxur-cli doc-drift fix." },

      { id:"A6", name:"Migrate, self-host & PM-skill", status:"active", deps:"A1, A3", crate:"odm-migrate; ai-engineering",
        cap:"migrate importer (idempotent, --dry-run, supersede-not-delete); run on odm's own docs; versioned per-type schemas (ODD-0020); self-host the plan; PM skill from ODD-0001; retire redundant framework prose.",
        slices:[["01","migrate importer core","done"],["02","migrate odm's own docs","done"],["03","schema versioning (ODD-0020)","done"],["04","self-host cutover","plan"],["05","PM-skill population","plan"],["06","retire framework prose","plan"]],
        note:"▶ ACTIVE — the FINAL v1.0.0 arc (the self-hosting trigger). slices 01–03 CDC-verified. 01–02: importer + `odm migrate`; 12 ODDs → 12 odd nodes (legacy intact, byte-proven), `odm check` GREEN, 3 flags settled with NO amendment. ★ slice03 SCHEMA-VERSIONING (Duncan; ODD-0020) LANDED: per-type frontmatter markers `schema: <type>/vN.N` (new odm_core::schema; additive Option, absent⇒v0.1); new nodes stamp `<type>/v1.0` (odm new + migrate); per-type field-validity a `check` Error (content_validity, store-read: work-only {desired_facts,deferred} / doc-only {supersedes,affects}); forward-compat (newer schema → reported UnsupportedSchema); backfill folded into migrate. REAL BACKFILL committed: `odm migrate docs/design` → 13 nodes/ files ALL odd/v1.0 (12 upgraded + ODD-0020 imported); check green; NO odm-index change. CDC PASS-WITH-NOTES (per-type impl is per-class work/document; type↔schema mismatch check deferred — both watched, non-blocking). cargo rows pending CI. NEXT: slice04 self-host cutover — the plan-set enters nodes/ ALREADY stamped v1.0 (the loop closes; crux = reflexive-import ordering). Git: off release/1.0.x." },
    ]},

    { title: "Post-MVP extensions (v1.0.0+)", arcs: [
      { id:"A7", name:"Two-clock telemetry", status:"scoped", deps:"A2, A3 (matures w/ A5)", crate:"odm-telemetry",
        cap:"Event log from gates+git; two-clock split (active-work vs inter-slice latency); language-agnostic covariates + structured CDC-verification emission; status×gate evidence matrix. Collect + describe — no forecasting.",
        slices:[["01","telemetry schema + slice↔git linkage","plan"],["02","event-log derivation","plan"],["03","structured CDC-verification emission","plan"],
                ["04","two-clock decomposition","plan"],["05","covariate collection & annotation","plan"],["06","evidence matrix + surfacing","plan"]],
        note:"Independently valuable; builds post-A6 / self-host." },

      { id:"A8", name:"Forecasting", status:"scoped", deps:"A7, A2", crate:"odm-forecast",
        cap:"Monte-Carlo over the real DAG with censoring-corrected node-time distributions; Bayesian hierarchical reference classes; two-clock control experiment; honest widening ranges, never dates.",
        slices:[["01","reference classes + distribution fitting","plan"],["02","Monte-Carlo DAG engine","plan"],["03","two-clock experiment + calibration","plan"],["04","forecast surfacing + export","plan"]],
        note:"Research-gated by ODD-0018. Metadata never targets; team/process never per-actor (Goodhart)." },

      { id:"—", name:"Interop — export (out)", status:"tentative", deps:"A3", crate:"ODD-0017 Part A",
        cap:"One-way, honestly-lossy projection of the rollup into another team's vocabulary; also the evangelism engine." },
      { id:"—", name:"Interop — reference-and-reconcile (in)", status:"tentative", deps:"A5", crate:"ODD-0017 Part B",
        cap:"external node type + cross-team edges; status reconciled, never authored; evidence-leveled." },
      { id:"—", name:"Visualization", status:"tentative", deps:"A3, A7", crate:"ascii-dag",
        cap:"On-demand DAG render + roadmap-as-projection; a renderer over the rollup + the A7 matrix." },
      { id:"—", name:"Advisory priority", status:"tentative", deps:"A2", crate:"—",
        cap:"Optional, non-authoritative ranking on top of the derived order — never the order itself." },
    ]},
  ]
};

// ── Render
function el(t, c, html){ const e=document.createElement(t); if(c) e.className=c; if(html!=null) e.innerHTML=html; return e; }

function arcCard(a){
  const card = el('div','card'); card.style.borderLeftColor = C[a.status];
  const top = el('div','top');
  top.append(el('span','id', a.id==='—'?'·':a.id), el('span','name', a.name));
  const badge = el('span','badge', LABEL[a.status]);
  badge.style.background = C[a.status];
  badge.style.color = (a.status==='complete'||a.status==='closed'||a.status==='active') ? '#06121a' : '#1a1206';
  if(a.status==='tentative'||a.status==='planned'||a.status==='scoped') badge.style.color='#fff';
  top.append(badge);
  card.append(top, el('div','cap', a.cap));

  const meta = el('div','meta',
    `<span><b>depends on:</b> ${a.deps}</span><span><b>crate:</b> ${a.crate}</span>` +
    (a.mvp?'<span style="color:var(--done)"><b>★ MVP capstone</b></span>':''));
  card.append(meta);

  const total = a.total ?? (a.slices?a.slices.length:0);
  const done  = a.done  ?? (a.slices?a.slices.filter(s=>s[2]==='done').length:0);
  if(total){
    const pct = Math.round(done/total*100);
    const bar = el('div','bar'); const fill = el('i'); fill.style.width = pct+'%';
    fill.style.background = C[a.status]; bar.append(fill);
    const cnt = el('div','meta', `<span><b>slices:</b> ${done}/${total} delivered</span>`);
    card.append(cnt, bar);
  }
  if(a.slices){
    const sl = el('div','slices');
    a.slices.forEach(([n,nm,st])=>{
      const mark = st==='done'?'✓' : st==='wip'?'●' : n;
      const ch = el('span','chip'+(st==='done'||st==='wip'?' done':''),
        `<span class="s">${mark}</span>${nm}`);
      if(st==='done') ch.style.borderColor = C[a.status];
      if(st==='wip'){ ch.style.borderColor = 'var(--active)'; ch.style.color='var(--active)'; }
      sl.append(ch);
    });
    card.append(sl);
  }
  if(a.note) card.append(el('div','note', a.note));
  return card;
}

const board = document.getElementById('board');
let arcsClosed=0, arcsTotal=0, slicesDone=0, slicesTotal=0;
DATA.groups.forEach(g=>{
  board.append(el('div','group-title', g.title));
  g.arcs.forEach(a=>{
    board.append(arcCard(a));
    if(a.id!=='—'){ arcsTotal++; if(a.status==='complete'||a.status==='closed') arcsClosed++; }
    const t=a.total??(a.slices?a.slices.length:0), d=a.done??(a.slices?a.slices.filter(s=>s[2]==='done').length:0);
    slicesTotal+=t; slicesDone+=d;
  });
});

const summary = document.getElementById('summary');
[['MVP','A1–A3 ✓','var(--done)'],
 ['Arcs landed', arcsClosed+' / '+arcsTotal, 'var(--closed)'],
 ['Slices delivered', slicesDone+' / '+slicesTotal, 'var(--accent)'],
 ['Latest', 'A5 ✓ closed','var(--done)'],
 ['Active', 'A6 · 2/6 (final)','var(--active)']
].forEach(([l,n,col])=>{
  const s=el('div','stat'); const nn=el('div','n',n); nn.style.color=col; s.append(nn, el('div','l',l)); summary.append(s);
});

document.getElementById('foot').textContent =
  `Snapshot generated ${DATA.generated} from docs/design-v1.0.0/ (project-plan + arc-plans). Static view — regenerate when status moves.`;
</script>
